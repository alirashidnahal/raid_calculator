name: Fix Code Style (lint + Prettier)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '.cursor/**'
      - '.github/**'
      - '.vscode/**'
      - 'public/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'README.md'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-code-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-code-style:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format

      - name: Run lint
        run: npm run lint

      - name: Generate commit timestamp
        id: timestamp
        run: echo "CURRENT_TIMESTAMP=$(TZ='Asia/Tehran' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Commit code style fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Apply code style fixes (Pint + Prettier) at ${{ env.CURRENT_TIMESTAMP }}"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false
