name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.meta.outputs.new_version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve version and changelog
        id: meta
        run: |
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")
          NEW_VERSION="v${PKG_VERSION}"
          ZIP_NAME="release-${NEW_VERSION}.zip"

          {
            echo "new_version=${NEW_VERSION}"
            echo "zip_name=${ZIP_NAME}"
          } >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_VERSION" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi

          {
            echo "COMMIT_MESSAGES<<EOF"
            git log --pretty=format:'- %s' "$RANGE"
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: |
          awk -v new_ver="$NEW_VERSION" -v changes="$COMMIT_MESSAGES" \
            '{gsub(/RELEASE_TAG/, new_ver); gsub(/CHANGE_LOG/, changes); print}' \
            .github/release_message.md > release.md

      - name: Prepare site and release ZIP
        run: |
          touch dist/.nojekyll
          cp LICENSE dist/
          (cd dist && zip -r "../${{ steps.meta.outputs.zip_name }}" .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            ${{ steps.meta.outputs.zip_name }}
            release.md
          if-no-files-found: error

      - name: Upload site dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site dist
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false

  release:
    needs: build
    runs-on: ubuntu-latest
    # Skip tag/release when this version tag already exists (e.g. workflow_dispatch redeploy)
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Create and push tag
        id: tag
        run: |
          VERSION="${{ needs.build.outputs.new_version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_version }}
          files: ${{ needs.build.outputs.zip_name }}
          body_path: release.md
          draft: true
